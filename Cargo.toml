[package]
name = "rsmemchk"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
rsmemchk = {path = "."}
extargsparse_worker = "^0.2.4"
extargsparse_codegen = "^0.1.4"
#extargsparse_worker = {path = "../extargsparse-rs/extargsparse_worker"}
#extargsparse_codegen = {path = "../extargsparse-rs/extargsparse_codegen"}


[[example]]
name = "manual"
path = "example/manual.rs"

[[example]]
name = "multi"
path = "example/multi.rs"

[[example]]
name = "extparser"
path = "example/extparser.rs"

[[example]]
name = "arcclone"
path = "example/arcclone.rs"


[dependencies]
libc = "0.2"
lazy_static = "^1.4.0"
chrono = "^0.4.0"
regex = "1"



[target.'cfg(windows)'.dependencies.winapi]
version = "^0.3"
features = ["minwinbase","synchapi","winnt","minwindef","psapi","processthreadsapi","basetsd","handleapi"]


[features]
debug_mode = []
