[package]
name = "rsmemgen"
version = "0.1.2"
edition = "2021"
description = """
Rust Memory Leak check library code generation for inline or inline(never)
"""
license = "MIT/Apache-2.0"
repository = "https://github.com/jeppeter/rsmemchk"

[lib]
proc-macro = true


[dependencies]
syn = { version = "^2", features = ["full", "parsing"] }
lazy_static = "^1.4.0"
proc-macro2 = { version = "1.0.32", default-features = false }
rand = "^0.8.5"
bytes = "^0.5.3"
chrono = "^0.4.0"
regex = "^1"
quote = "^1.0.40"


[features]
debug_mode = []
rsmemchk_mode = []